name: Build and Push Poller

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/bash-poller/**'
      - '!apps/bash-poller/helm-chart/**'
      - '.github/workflows/build-poller.yml'
      - '.github/workflows/_image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: write
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      app: poller
      dockerfile: apps/bash-poller/Dockerfile
      uv-lock-check: false
      values: |
        apps/bash-poller/helm-chart/values.yaml .imageConfig.tag
