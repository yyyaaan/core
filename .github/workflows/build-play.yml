name: Build and Push Play App

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/py-play/**'
      - '!apps/py-play/helm-chart/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build-play.yml'
      - '.github/workflows/_image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: write
      packages: write
      pull-requests: write
    secrets: inherit
    with:
      app: play
      dockerfile: apps/py-play/Dockerfile
      uv-lock-check: true
      values: |
        apps/py-play/helm-chart/values.yaml .image.tag
        apps/py-play/helm-chart/values-test.yaml .image.tag
