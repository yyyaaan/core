name: Test Web App

on:
  pull_request:
    paths:
      - 'apps/py-web/**'
      - '!apps/py-web/helm-chart/**'
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/test-web.yml'
      - '.github/scripts/test_comment.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # one comment, updated in place
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # no moving major tags since v8
        with:
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check
        
      - name: Install dependencies
        run: uv sync --package web

      - name: Run Ruff check
        run: uv run ruff check apps/py-web/

      - name: Run Pytest
        run: uv run pytest apps/py-web/tests/ --junitxml=pytest-results.xml

      - name: Comment test results
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/test_comment.py Web pytest-results.xml
