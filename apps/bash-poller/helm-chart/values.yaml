imageConfig: &imageConfig
  repository: ghcr.io/yyyaaan/core/poller
  tag: "sha-b8a56e5"
  pullPolicy: IfNotPresent

# debugPod use ffmpeg configs and all jobs' volumes
debugPod:
  enabled: false

# ffmpeg has init container, see manifest directly
ffmpeg:
  namespace: home-internal
  schedule: "3 1 * * *"          # daily timelapse, yesterday in TZ from tz-config
  monthlySchedule: "59 11 2 * *"  # 2nd: leaves room for the 1st's daily export
  timezone: "Etc/UTC"
  image:
    <<: *imageConfig
  envFromSecretList:
    - poller-credentials
    - tz-config
  hostPathMedia: /mnt/kingston/share/media
  resources:
    requests:
      cpu: "1000m"
      memory: "500Mi"
    limits:
      cpu: "2000m"
      memory: "3072Mi"

elenia:
  namespace: home-internal
  schedule: "2-59/15 * * * *"
  timezone: "Europe/Helsinki"
  image:
    <<: *imageConfig
  envFromSecretList:
    - poller-credentials
    - tz-config
  hostPathMedia: /mnt/kingston/share/media
  hostPathForData: /mnt/kingston/home/data/app
  resources:
    requests:
      cpu: "10m"
      memory: "50Mi"
    limits:
      cpu: "100m"
      memory: "200Mi"

