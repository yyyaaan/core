apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-video
  namespace: {{ .Values.ffmpeg.namespace }}
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/component: scheduled
spec:
  schedule: {{ .Values.ffmpeg.schedule | quote }}
  timeZone: {{ .Values.ffmpeg.timezone | quote}}
  concurrencyPolicy: Forbid 
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          initContainers:
          - name: frigate-export
            image: "{{ .Values.ffmpeg.image.repository }}:{{ .Values.ffmpeg.image.tag }}"
            imagePullPolicy: {{ .Values.ffmpeg.image.pullPolicy | default "IfNotPresent" | quote }}
            command: ["/bin/bash", "-c"]
            args:  # -u make sure print out not buffered
              - |
                python3 -u - << 'EOF'
                import os
                import re
                from datetime import datetime, timedelta
                from time import sleep
                from requests import get, post

                name_prefix = "day90sec"
                max_polling_hours = 12
                polling_interval_seconds = 300
                frigate_url = "http://frigate-service.home-internal.svc.cluster.local:5000"

                now = datetime.now()
                end_polling_time = now + timedelta(hours=max_polling_hours)
                print("Started", now)

                # yesterday, local midnight to midnight (TZ from tz-config; naive datetimes keep DST right)
                day_end = datetime(now.year, now.month, now.day)
                day_start = day_end - timedelta(days=1)
                ts0, ts = int(day_start.timestamp()), int(day_end.timestamp())
                name = f"{name_prefix}_{day_start:%Y%m%d}.mp4"  # unique per day, our handle for reruns
                print(f"{name}: {day_start:%b%dT%H:%M:%S}--{day_end:%b%dT%H:%M:%S}")


                def find_existing(name: str) -> str | None:
                    """ID of this day's export if already done, running or queued (Frigate doesn't dedupe)."""
                    rows = get(url=f"{frigate_url}/api/exports", params={"cameras": "yard"})
                    rows.raise_for_status()
                    mine = sorted((e for e in rows.json() if e["name"] == name), key=lambda e: e["in_progress"])
                    if mine:
                        return mine[0]["id"]  # finished before running
                    jobs = get(url=f"{frigate_url}/api/jobs/export")
                    jobs.raise_for_status()
                    queued = [j for j in jobs.json() if j.get("name") == name and j.get("status") in ("queued", "running")]
                    return queued[0]["id"] if queued else None


                if export_id := find_existing(name):
                    print("Reusing existing export", export_id, flush=True)
                else:
                    r = post(
                        url=f"{frigate_url}/api/export/custom/yard/start/{ts0}/end/{ts}",
                        json={"ffmpeg_output_args": "-vf setpts=0.001*PTS -r 120 -crf 30", "name": name},
                    )
                    print(r.text, r.status_code, flush=True)
                    r.raise_for_status()
                    export_id = r.json()["export_id"]


                def export_status(export_id: str) -> dict | None:
                    """Export row once done, None while queued/running; raises on failure."""
                    row = get(url=f"{frigate_url}/api/exports/{export_id}")
                    if row.ok and not row.json().get("in_progress"):
                        return row.json()
                    # 0.18 queues exports: no DB row until the job starts; job entry dropped ~5s after it ends
                    job = get(url=f"{frigate_url}/api/jobs/export/{export_id}")
                    if job.ok:
                        status = job.json().get("status")
                        print(f"{status} {job.json().get('progress_percent', 0):.0f}%", flush=True)
                        if status in ("failed", "cancelled"):
                            raise Exception(f"Export {status}: {job.json().get('error_message')}")
                        return None
                    if row.ok:
                        return None  # running, job entry not visible
                    raise Exception("Export ID not found in exports or export jobs (Frigate restarted or export failed)")


                while (export := export_status(export_id)) is None:
                    if datetime.now() > end_polling_time:
                        raise Exception("Polling ends due to time limit. Export not completed")
                    sleep(polling_interval_seconds)

                # same path in this pod: Frigate's /media/frigate is our /media/frigate
                with open("/handoff/export_path", "w") as f:
                    f.write(export["video_path"])
                with open("/handoff/day", "w") as f:  # main container must not recompute: a rerun may cross midnight
                    f.write(f"{day_start:%Y%m%d}")
                print("Ready!", export["video_path"])

                # retention: only our own daily exports, by the day in their name
                keep_days = int(os.environ.get("EXPORT_RETENTION_DAYS", "14"))
                cutoff = f"{day_end - timedelta(days=keep_days):%Y%m%d}"
                ours = re.compile(name_prefix + r"_(\d{8})\.mp4")
                try:
                    rows = get(url=f"{frigate_url}/api/exports", params={"cameras": "yard"})
                    rows.raise_for_status()
                    old = [
                        e["id"] for e in rows.json()
                        if not e["in_progress"] and (m := ours.fullmatch(e["name"])) and m[1] < cutoff
                    ]
                    if old:
                        r = post(url=f"{frigate_url}/api/exports/delete", json={"ids": old})
                        r.raise_for_status()
                    print(f"Retention: deleted {len(old)} exports before {cutoff}", flush=True)
                except Exception as e:
                    print("Retention cleanup failed (non-fatal):", e, flush=True)
                EOF
            envFrom:
            {{- range .Values.ffmpeg.envFromSecretList }}
              - secretRef:
                  name: {{ . | quote }}
            {{- end }}
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: EXPORT_RETENTION_DAYS
              value: {{ .Values.ffmpeg.exportRetentionDays | quote }}
            volumeMounts:
            - name: handoff
              mountPath: /handoff
            resources:
              requests:
                cpu: "10m"
                memory: "10Mi"
              limits:
                cpu: "100m"
                memory: "100Mi"
          containers:
          - name: ffmpeg-encoding
            image: "{{ .Values.ffmpeg.image.repository }}:{{ .Values.ffmpeg.image.tag }}"
            imagePullPolicy: {{ .Values.ffmpeg.image.pullPolicy | default "IfNotPresent" | quote }}
            command: ["/bin/bash", "/app/job_ffmpeg.sh"]
            envFrom:
            {{- range $.Values.ffmpeg.envFromSecretList }}
              - secretRef:
                  name: {{ . | quote }}
            {{- end }}
            env:
            - name: LOCAL_RETENTION_DAYS
              value: {{ .Values.ffmpeg.localRetentionDays | quote }}
            - name: R2_PUBLIC_URL
              value: {{ .Values.ffmpeg.publicBaseUrl | quote }}
            resources:
              {{- toYaml .Values.ffmpeg.resources | nindent 14 }}
            volumeMounts:
            - name: media-folder
              mountPath: /media
            - name: handoff
              mountPath: /handoff
          volumes:
          - name: handoff
            emptyDir: {}
          - name: media-folder
            hostPath:
              path: {{ .Values.ffmpeg.hostPathMedia }}
              type: Directory
