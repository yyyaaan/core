apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-video
  namespace: {{ .Values.ffmpeg.namespace }}
  labels:
    app.kubernetes.io/name: video
    app.kubernetes.io/component: scheduled
spec:
  schedule: {{ .Values.ffmpeg.schedule | quote }}
  timeZone: {{ .Values.ffmpeg.timezone | quote}}
  concurrencyPolicy: Forbid 
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          initContainers:
          - name: frigate-export
            image: "{{ .Values.ffmpeg.image.repository }}:{{ .Values.ffmpeg.image.tag }}"
            imagePullPolicy: {{ .Values.ffmpeg.image.pullPolicy | default "IfNotPresent" | quote }}
            command: ["/bin/bash", "-c"]
            args:  # -u make sure print out not buffered
              - |
                python3 -u - << 'EOF'
                from datetime import datetime, timedelta
                from time import sleep
                from requests import get, post

                offset = 0                  # yesterday
                hours = 24                  # a whole day
                name_prefix = "day90sec"
                max_polling_hours = 12
                polling_interval_seconds = 300
                frigate_url = "http://frigate-service.home-internal.svc.cluster.local:5000"

                now = datetime.now()
                end_polling_time = now + timedelta(hours=max_polling_hours)
                print("Started", now)

                yesterday_end = datetime(now.year, now.month, now.day)
                ts = int(yesterday_end.timestamp()) - offset * 3600
                ts0 = ts - hours * 3600

                r = post(
                    url=f"{frigate_url}/api/export/custom/yard/start/{ts0}/end/{ts}",
                    json={
                        "ffmpeg_output_args": "-vf setpts=0.001*PTS -r 120 -crf 30",
                        "name": f"{name_prefix}_{datetime.fromtimestamp(ts0):%Y%m%d}.mp4",
                    },
                )

                print(f"{datetime.fromtimestamp(ts0):%b%dT%H:%M:%S}--{datetime.fromtimestamp(ts):%b%dT%H:%M:%S}")
                print(r.text, r.status_code, flush=True)

                # polling for completion
                r.raise_for_status()
                export_id = r.json()["export_id"]

                def find_export(export_id: str) -> dict:
                    for item in get(url=f"{frigate_url}/api/exports").json():
                        if item["id"] == export_id:
                            return item
                    raise Exception("Export ID not found in polling endpoint")


                while (export := find_export(export_id))["in_progress"]:
                    print("waiting...", flush=True)
                    if datetime.now() > end_polling_time:
                        raise Exception("Polling ends due to time limit. Export not completed")
                    sleep(polling_interval_seconds)

                # same path in this pod: Frigate's /media/frigate is our /media/frigate
                with open("/handoff/export_path", "w") as f:
                    f.write(export.get("video_path") or "")
                print("Ready!", export.get("video_path"))
                EOF
            envFrom:
            {{- range .Values.ffmpeg.envFromSecretList }}
              - secretRef:
                  name: {{ . | quote }}
            {{- end }}
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            volumeMounts:
            - name: handoff
              mountPath: /handoff
            resources:
              requests:
                cpu: "10m"
                memory: "10Mi"
              limits:
                cpu: "100m"
                memory: "100Mi"
          containers:
          - name: ffmpeg-encoding
            image: "{{ .Values.ffmpeg.image.repository }}:{{ .Values.ffmpeg.image.tag }}"
            imagePullPolicy: {{ .Values.ffmpeg.image.pullPolicy | default "IfNotPresent" | quote }}
            command: ["/bin/bash", "/app/job_ffmpeg.sh"]
            envFrom:
            {{- range $.Values.ffmpeg.envFromSecretList }}
              - secretRef:
                  name: {{ . | quote }}
            {{- end }}
            resources:
              {{- toYaml .Values.ffmpeg.resources | nindent 14 }}
            volumeMounts:
            - name: media-folder
              mountPath: /media
            - name: handoff
              mountPath: /handoff
          volumes:
          - name: handoff
            emptyDir: {}
          - name: media-folder
            hostPath:
              path: {{ .Values.ffmpeg.hostPathMedia }}
              type: Directory
