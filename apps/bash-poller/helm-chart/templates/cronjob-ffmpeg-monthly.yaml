apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-ffmpeg-monthly
  namespace: {{ .Values.ffmpeg.namespace }}
  labels:
    app.kubernetes.io/name: ffmpeg-monthly
    app.kubernetes.io/component: scheduled
spec:
  schedule: {{ .Values.ffmpeg.monthlySchedule | quote }}
  timeZone: {{ .Values.ffmpeg.timezone | quote}}
  concurrencyPolicy: Forbid 
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ffmpeg-monthly
            image: "{{ .Values.ffmpeg.image.repository }}:{{ .Values.ffmpeg.image.tag }}"
            imagePullPolicy: {{ .Values.ffmpeg.image.pullPolicy | default "IfNotPresent" | quote }}
            command: ["/bin/bash", "/app/job_monthly.sh"]
            envFrom:
            {{- range $.Values.ffmpeg.envFromSecretList }}
              - secretRef:
                  name: {{ . | quote }}
            {{- end }}
            resources:
              {{- toYaml .Values.ffmpeg.resources | nindent 14 }}
            volumeMounts:
            - name: media-folder
              mountPath: /media
          volumes:
          - name: media-folder
            hostPath:
              path: {{ .Values.ffmpeg.hostPathMedia }}
              type: Directory
