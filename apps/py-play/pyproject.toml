[project]
name = "play"
version = "1.0.0"
description = "Personal utilities: daily football + S-Bonus digest, spot price chart, water meter camera"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "beautifulsoup4",
    "fastapi[standard]",
    "httpx",
    "jinja2",
    "pillow",
    "plotly",
    "pydantic-settings",
    "uvicorn",
]

[project.scripts]
play = "play.main:main"
play-dev = "play.main:main_dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/play"]
