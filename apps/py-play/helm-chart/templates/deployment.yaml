apiVersion: apps/v1
kind: Deployment
metadata:
  name: play
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: play
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: play
  template:
    metadata:
      labels:
        app: play
    spec:
      containers:
      - name: play
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" | quote }}
        envFrom:
        {{- range .Values.envFromSecretList }}
          - secretRef:
              name: {{ . | quote }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.service.targetPort }}
          periodSeconds: 30
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: 10
          periodSeconds: 60
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "384Mi"