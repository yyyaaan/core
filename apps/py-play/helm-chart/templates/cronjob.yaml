apiVersion: batch/v1
kind: CronJob
metadata:
  name: play-mailing
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: play-mailing
    app.kubernetes.io/component: scheduled
spec:
  schedule: {{ .Values.mailing.schedule | quote }}
  timeZone: {{ .Values.mailing.timeZone | quote }}
  concurrencyPolicy: Forbid 
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: post-scheduler
            image: curlimages/curl:latest
            env:
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mailing.tokenSecret | quote }}
                  key: INTERNAL_TOKEN
            command: ["/bin/sh", "-c"]
            args:
              - |
                curl -sSf --max-time 120 -H "Authorization: Bearer $INTERNAL_TOKEN" -X POST "http://play-svc/scheduled?audience=2"
            resources:
              requests:
                cpu: "10m"
                memory: "10Mi"
              limits:
                cpu: "100m"
                memory: "150Mi"
