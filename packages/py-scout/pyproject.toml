[project]
name = "scout"
version = "0.1.0"
description = "Browser-backed scraping: drives your own Chrome over CDP and reuses each site's own API calls"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "playwright",
    "pydantic-settings",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]
