# this are the dependencies that are always needed for cluster!
# gitops for the below are registered in domain level gitops
---
# 1. Traefik (Remote Helm Chart)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.1.3
    helm:
      parameters:
        - name: ports.web.exposedPort
          value: "8080"
        - name: ports.websecure.exposedPort
          value: "8443"
        # keep the client IP cloudflared forwards (X-Forwarded-For)
        - name: ports.web.forwardedHeaders.trustedIPs[0]
          value: "10.42.0.0/16"
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
---
# 2. Cluster Bootstrap
# This will handle your Cloudflare Tunnel and Traefik Middleware
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-cloudflare-etc
  namespace: argocd
spec:
  project: gitops
  source:
    repoURL: https://github.com/yyyaaan/core.git
    path: infra/bootstrap/manifests
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # syncPolicy:
  #   automated:
  #     prune: true
  #     selfHeal: true
